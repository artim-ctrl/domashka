services:
  domashka:
    build: .
    image: domashka:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PORT:-8080}:8080"
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    pids_limit: 128
    cpus: 1
    stop_grace_period: 15s
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: "3" }
