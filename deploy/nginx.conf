# Вставить внутрь server { … } сайта example.com — туда же, где настроен TLS.
# После правки: sudo nginx -t && sudo systemctl reload nginx

location = /domashka {
    absolute_redirect off;   # Location: /domashka/ — без подстановки внутреннего адреса и порта
    return 301 /domashka/;
}

location /domashka/ {
    # Без «/» на конце: путь уходит в контейнер как есть, префикс /domashka приложение
    # снимает само (BASE_PATH в compose.yaml). Порт — тот же, что PORT при деплое.
    proxy_pass http://127.0.0.1:8080;

    # Ответы из proxy_pass nginx по умолчанию не сжимает, а JS без сжатия — ~240 КБ.
    # Записи (.m4a) уже сжаты — их не трогаем.
    gzip on;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/css text/javascript application/javascript application/json;
}
